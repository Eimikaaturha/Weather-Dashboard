<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main>
        <header>
            <h1>Weather Dashboard</h1>
        </header>
        <form id="search-form">
            <label for="city-input" class="sr-only">City</label>
            <input name="city" autocomplete="off" type="search" id="city-input" placeholder="Enter a city" required />
            <button type="submit">Search</button>
        </form>

        <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>

        <section id="weather-card" class="card" aria-labelledby="city-name" hidden>
            <h2 id="city-name">--</h2>
            <p id="temperature">--</p>
            <p id="temp-range">
                <span id="temp-max" class="temp-max">--</span>
                <span id="temp-min" class="temp-min">--</span>
            </p>
            <p id="weather-icon" aria-hidden="true"></p>
            <p id="weather-description">--</p>
            <p>Humidity: <span id="humidity">--</span></p>
            <p>Wind speed: <span id="wind-speed">--</span></p>
        </section>

        <section id="forecast" aria-labelledby="forecast-heading" hidden>
            <h2 id="forecast-heading">5-Day Forecast</h2>
            <ul id="forecast-container"></ul>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>

</html>
